# Throwaway Postgres for the e2e test. The Secret has the keys of a
# CloudNativePG "<cluster>-app" Secret, the chart's defaults.
apiVersion: v1
kind: Secret
metadata:
  name: tmdb-app
stringData:
  host: tmdb
  port: "5432"
  dbname: tm
  username: tm
  password: e2e-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmdb
spec:
  selector:
    matchLabels: {app: tmdb}
  template:
    metadata:
      labels: {app: tmdb}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18-alpine
          env:
            - {name: POSTGRES_DB, value: tm}
            - {name: POSTGRES_USER, value: tm}
            - {name: POSTGRES_PASSWORD, value: e2e-password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, tm, -h, 127.0.0.1]
---
apiVersion: v1
kind: Service
metadata:
  name: tmdb
spec:
  selector: {app: tmdb}
  ports:
    - port: 5432
