{{- if not .Values.encryptionKey.existingSecret }}
{{- $v := required "encryptionKey.value or encryptionKey.existingSecret is required" .Values.encryptionKey.value }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" $v) }}
{{- fail "encryptionKey.value must be 64 hex characters (openssl rand -hex 32)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tm.keySecret" . }}
  labels:
    {{- include "tm.labels" . | nindent 4 }}
  annotations:
    # Losing it makes the stored passwords unreadable.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.encryptionKey.secretKey }}: {{ $v | quote }}
{{- end }}
