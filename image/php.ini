; torrentmonitor-helm
date.timezone = ${TM_TIMEZONE}
memory_limit = 512M
expose_php = Off
; engine.php and the API's run endpoint can take minutes
max_execution_time = 600
opcache.enable = 1
opcache.validate_timestamps = 0
; Errors to the log (stderr), never into pages: upstream emits notices that
; would corrupt the UI's JSON responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
