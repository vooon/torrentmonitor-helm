# Tag v<VERSION> (e.g. v3.3.6-1) on main: image and chart to ghcr.io.
name: release
on:
  push:
    tags: ['v*']

permissions:
  # contents: the GitHub Release; packages: ghcr.
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Tag matches VERSION
        run: |
          scripts/check-versions.sh
          [ "${GITHUB_REF_NAME}" = "v$(cat VERSION)" ] || { echo "tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/torrentmonitor" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" .

      - uses: azure/setup-helm@v5
      - name: Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/torrentmonitor -d dist
          helm push "dist/torrentmonitor-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          upstream=$(sed -nE 's/^appVersion: *"?([^"]+)"?$/\1/p' charts/torrentmonitor/Chart.yaml)
          commit=$(git -C upstream rev-parse --short=12 HEAD)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          TorrentMonitor **${upstream}** (upstream \`${commit}\`), release ${VERSION#*-}.

          \`\`\`sh
          docker pull ghcr.io/${owner}/torrentmonitor:${VERSION}
          helm install tm oci://ghcr.io/${owner}/charts/torrentmonitor --version ${VERSION}
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/torrentmonitor-$VERSION.tgz" \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag
